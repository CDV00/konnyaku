name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: backend/global.json
      - run: dotnet restore Konnyaku.slnx
      - run: dotnet build Konnyaku.slnx --no-restore -c Release
      # Integration tests start PostgreSQL with Testcontainers (Docker is available on GitHub runners).
      - run: dotnet test --solution Konnyaku.slnx --no-build -c Release

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build

  signaling:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/signaling
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/signaling
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  # Builds the production images on amd64 and on a real arm64 runner and starts them (no push):
  # catches Dockerfile and architecture problems in the PR, before the Deploy workflow runs on main.
  images:
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        run: |
          for target in api worker migrator; do
            docker buildx build backend --target "$target" --load \
              --cache-from "type=gha,scope=backend-${{ matrix.arch }}" --cache-to "type=gha,mode=max,scope=backend-${{ matrix.arch }}" \
              -t "konnyaku-$target:ci"
          done
          docker buildx build frontend --load \
            --cache-from "type=gha,scope=web-${{ matrix.arch }}" --cache-to "type=gha,mode=max,scope=web-${{ matrix.arch }}" \
            -t konnyaku-web:ci
          docker buildx build services/signaling --load \
            --cache-from "type=gha,scope=signaling-${{ matrix.arch }}" --cache-to "type=gha,mode=max,scope=signaling-${{ matrix.arch }}" \
            -t konnyaku-signaling:ci
      - name: Smoke test
        run: infra/deploy/scripts/smoke-test.sh konnyaku ci
      # PostgreSQL + pgBackRest image the server builds itself (infra/deploy/postgres), deploy/backup scripts, compose file.
      - name: Backup image and deploy scripts
        run: |
          docker build -t konnyaku-postgres:17 infra/deploy/postgres
          docker run --rm konnyaku-postgres:17 pgbackrest version
          for f in infra/deploy/scripts/*.sh infra/deploy/postgres/backup/*; do bash -n "$f"; done
          cd infra/deploy && cp .env.example .env && ./scripts/gen-secrets.sh >> .env && docker compose config --quiet
