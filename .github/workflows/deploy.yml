name: Deploy

# Builds the four images for amd64 and arm64, smoke-tests each on its own architecture, pushes them to GHCR
# as multi-arch tags and rolls the server forward.
# After CI succeeds on main it deploys to staging; production is deployed by hand
# (Actions → Deploy → Run workflow → production), optionally gated by required reviewers on that environment.
# Repository settings needed (Settings → Environments → production / staging):
#   secrets  DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY (private key), DEPLOY_KNOWN_HOSTS (ssh-keyscan -H <host>)
#   vars     DEPLOY_PATH (default /opt/konnyaku)
# The server logs in to GHCR once with a read:packages token (docs/trien-khai.md).

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [staging, production]
        default: staging

concurrency:
  group: deploy-${{ github.event.inputs.environment || 'staging' }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  # Each architecture is built on a runner of that architecture (arm64: the GitHub Arm runner, free for public repos),
  # smoke-tested there, then pushed as <sha>-<arch>. Native builds keep native modules (sharp) on the right arch.
  images:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      # Image names must be lowercase; the owner (e.g. CDV00) may not be.
      - name: Image names
        run: |
          echo "REGISTRY=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
          echo "TAG=$(git rev-parse --short=12 HEAD)-${{ matrix.arch }}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build
        run: |
          for target in api worker migrator; do
            docker buildx build backend --target "$target" --load \
              --cache-from "type=gha,scope=backend-${{ matrix.arch }}" --cache-to "type=gha,mode=max,scope=backend-${{ matrix.arch }}" \
              -t "$REGISTRY/konnyaku-$target:$TAG"
          done
          docker buildx build frontend --load \
            --cache-from "type=gha,scope=web-${{ matrix.arch }}" --cache-to "type=gha,mode=max,scope=web-${{ matrix.arch }}" \
            -t "$REGISTRY/konnyaku-web:$TAG"
      - name: Smoke test
        run: infra/deploy/scripts/smoke-test.sh "$REGISTRY/konnyaku" "$TAG"
      - name: Push
        run: for image in api worker migrator web; do docker push --quiet "$REGISTRY/konnyaku-$image:$TAG"; done

  # One multi-arch tag per image (<sha> and latest): Docker on the server pulls the variant for its CPU.
  manifest:
    needs: images
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - id: tag
        env:
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: echo "tag=${SHA:0:12}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create multi-arch tags
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          registry="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          for image in api worker migrator web; do
            docker buildx imagetools create -t "$registry/konnyaku-$image:$TAG" -t "$registry/konnyaku-$image:latest" \
              "$registry/konnyaku-$image:$TAG-amd64" "$registry/konnyaku-$image:$TAG-arm64"
          done

  deploy:
    needs: manifest
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'staging' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          sparse-checkout: infra/deploy
      - name: Roll forward on the server
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/konnyaku' }}
          TAG: ${{ needs.manifest.outputs.tag }}
        run: |
          if [ -z "$SSH_KEY" ] || [ "$TARGET" = "@" ]; then
            echo "::error::This environment has no DEPLOY_* secrets yet (docs/trien-khai.md)"; exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          # Stack definition comes from the repo; .env (secrets, domain) and backups/ stay on the server.
          cd infra/deploy
          tar -czf - compose.yaml Caddyfile postgres scripts .env.example \
            | ssh -i ~/.ssh/id_deploy "$TARGET" "mkdir -p '$DEPLOY_PATH' && tar -xzf - -C '$DEPLOY_PATH'"
          ssh -i ~/.ssh/id_deploy "$TARGET" "cd '$DEPLOY_PATH' && sed -i 's/^IMAGE_TAG=.*/IMAGE_TAG=$TAG/' .env \
            && docker compose pull --quiet && docker compose up -d --remove-orphans && docker image prune -f"
