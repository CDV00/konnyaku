# Throwaway infrastructure for the end-to-end tests (run.mjs starts it on a fresh volume and removes it afterwards).
# Ports come from the same E2E_* variables as run.mjs, so it can run next to the dev stack (5433 / 1025 / 8025).
name: konnyaku-e2e

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: konnyaku
      POSTGRES_PASSWORD: konnyaku_dev
      POSTGRES_DB: konnyaku
    ports:
      - "${E2E_PG_PORT:-5450}:5432"
    volumes:
      - ../../infra/docker/postgres/init:/docker-entrypoint-initdb.d:ro
    # No volume for the data: every run starts from an empty database.
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U konnyaku -d konnyaku"]
      interval: 2s
      retries: 30

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${E2E_SMTP_PORT:-1030}:1025"
      - "${E2E_MAILPIT_PORT:-8030}:8025"
