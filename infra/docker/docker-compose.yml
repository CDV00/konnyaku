name: konnyaku

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: konnyaku
      POSTGRES_PASSWORD: konnyaku_dev
      POSTGRES_DB: konnyaku
    ports:
      - "5433:5432"
    volumes:
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U konnyaku -d konnyaku"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6380:6379"

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"

  # No object storage yet: nothing uses it. minio/minio was removed from Docker Hub (Sep 2026) and Quay now needs a login;
  # pick a maintained S3-compatible store when recordings/backups need one.

volumes:
  postgres-data:
