# Konnyaku production stack on one VPS (docker compose v2).
#   cp .env.example .env && ./scripts/gen-secrets.sh >> .env   # once, then edit BASE_DOMAIN / ACME_EMAIL / IMAGE_*
#   docker compose up -d
# Caddy publishes 80/443 (web + classroom signaling under /rtc/*); coturn (TURN for the built-in classroom) uses the
# host network: 3478 udp/tcp and the relay range TURN_MIN_PORT-TURN_MAX_PORT udp. Everything else stays internal.
# Runbook: docs/trien-khai.md

name: konnyaku

x-backend-env: &backend-env
  ConnectionStrings__platform: Host=postgres;Database=konnyaku;Username=kk_platform;Password=${DB_PASSWORD_PLATFORM:?}
  ConnectionStrings__catalog: Host=postgres;Database=konnyaku;Username=kk_catalog;Password=${DB_PASSWORD_CATALOG:?}
  ConnectionStrings__identity: Host=postgres;Database=konnyaku;Username=kk_identity;Password=${DB_PASSWORD_IDENTITY:?}
  ConnectionStrings__organization: Host=postgres;Database=konnyaku;Username=kk_organization;Password=${DB_PASSWORD_ORGANIZATION:?}
  ConnectionStrings__academic: Host=postgres;Database=konnyaku;Username=kk_academic;Password=${DB_PASSWORD_ACADEMIC:?}
  ConnectionStrings__crm: Host=postgres;Database=konnyaku;Username=kk_crm;Password=${DB_PASSWORD_CRM:?}
  ConnectionStrings__scheduling: Host=postgres;Database=konnyaku;Username=kk_scheduling;Password=${DB_PASSWORD_SCHEDULING:?}
  ConnectionStrings__billing: Host=postgres;Database=konnyaku;Username=kk_billing;Password=${DB_PASSWORD_BILLING:?}
  ConnectionStrings__workspace: Host=postgres;Database=konnyaku;Username=kk_workspace;Password=${DB_PASSWORD_WORKSPACE:?}
  ConnectionStrings__learning: Host=postgres;Database=konnyaku;Username=kk_learning;Password=${DB_PASSWORD_LEARNING:?}
  ConnectionStrings__hr: Host=postgres;Database=konnyaku;Username=kk_hr;Password=${DB_PASSWORD_HR:?}
  ConnectionStrings__notification: Host=postgres;Database=konnyaku;Username=kk_notification;Password=${DB_PASSWORD_NOTIFICATION:?}
  ConnectionStrings__assessment: Host=postgres;Database=konnyaku;Username=kk_assessment;Password=${DB_PASSWORD_ASSESSMENT:?}
  Auth__SigningKey: ${AUTH_SIGNING_KEY:?}
  Platform__AdminKey: ${PLATFORM_ADMIN_KEY:?}
  Platform__BaseDomain: ${BASE_DOMAIN:?}
  # Memory profile (.env.example, docs/toi-uu-tai-nguyen.md). One connection pool per module role (12 per process):
  # cap each pool so every replica together stays under PG_MAX_CONNECTIONS, and close idle connections after 60 s.
  Database__MaxPoolSize: ${DB_POOL_MAX:-6}
  Database__ConnectionIdleLifetime: ${DB_POOL_IDLE_SECONDS:-60}
  # Only host serving the platform console (/platform); must equal KONNYAKU_ADMIN_HOST of the web service.
  Platform__AdminHost: admin.${BASE_DOMAIN:?}
  # HMAC key of the public-form captcha (proof of work); CAPTCHA_ENABLED=false only for a private test stack.
  Captcha__Key: ${CAPTCHA_KEY:?}
  Captcha__Enabled: ${CAPTCHA_ENABLED:-true}
  # Email (Notification module); see docs/trien-khai.md.
  Notification__Smtp__Host: ${SMTP_HOST:-}
  Notification__Smtp__Port: ${SMTP_PORT:-587}
  Notification__Smtp__Username: ${SMTP_USERNAME:-}
  Notification__Smtp__Password: ${SMTP_PASSWORD:-}
  Notification__Smtp__Security: ${SMTP_SECURITY:-Auto}
  Notification__Smtp__FromAddress: ${SMTP_FROM_ADDRESS:-}
  Notification__Smtp__FromName: ${SMTP_FROM_NAME:-Konnyaku}
  # Built-in classroom (WebRTC mesh): tickets for the signaling service, STUN/TURN with short-lived credentials.
  Rtc__SignalingSecret: ${SIGNALING_SECRET:?}
  Rtc__StunUrls__0: stun:${TURN_HOST:-${BASE_DOMAIN}}:3478
  Rtc__TurnUrls__0: turn:${TURN_HOST:-${BASE_DOMAIN}}:3478?transport=udp
  Rtc__TurnUrls__1: turn:${TURN_HOST:-${BASE_DOMAIN}}:3478?transport=tcp
  Rtc__TurnSecret: ${TURN_SECRET:?}

x-logging: &logging
  driver: json-file
  options:
    max-size: 20m
    max-file: "5"

services:
  caddy:
    image: caddy:2.10
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      BASE_DOMAIN: ${BASE_DOMAIN:?}
      ACME_EMAIL: ${ACME_EMAIL:?}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [edge]
    depends_on: [web, signaling]
    logging: *logging

  web:
    image: ${IMAGE_WEB:-ghcr.io/OWNER/konnyaku-web}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      KONNYAKU_API_URL: http://api:8080
      # V8 heap cap: without it the heap keeps growing (~2x RAM at the same load); below ~256 MB Next.js runs out
      # of heap under load (docs/toi-uu-tai-nguyen.md).
      NODE_OPTIONS: --max-old-space-size=${WEB_HEAP_MB:-512}
      # Keep idle sockets open longer than Caddy reuses them (2 min); with Node's 5 s default Caddy sometimes sends a
      # request on a socket Node is closing and answers 502 (it cannot retry a POST).
      KEEP_ALIVE_TIMEOUT: "130000"
      KONNYAKU_ADMIN_HOST: admin.${BASE_DOMAIN:?}
      KONNYAKU_BASE_DOMAIN: ${BASE_DOMAIN:?}
    deploy:
      replicas: ${WEB_REPLICAS:-2}
      resources:
        limits:
          memory: ${WEB_MEM_LIMIT:-768m}
    networks: [edge, app]
    depends_on: [api]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging: *logging

  api:
    image: ${IMAGE_API:-ghcr.io/OWNER/konnyaku-api}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      <<: *backend-env
      # Trust X-Forwarded-For only from the web containers (the only caller), for per-visitor rate limits.
      ForwardedHeaders__KnownNetworks__0: ${APP_SUBNET:-172.30.1.0/24}
      # 2 GB profile: dispatch the outbox here and run WORKER_REPLICAS=0.
      Worker__InProcess: ${API_RUNS_WORKER:-false}
    deploy:
      replicas: ${API_REPLICAS:-2}
      resources:
        limits:
          memory: ${API_MEM_LIMIT:-512m}
    networks: [app, data]
    depends_on:
      migrator:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging: *logging

  worker:
    image: ${IMAGE_WORKER:-ghcr.io/OWNER/konnyaku-worker}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      <<: *backend-env
      # One outbox loop per module: a few connections per pool are enough.
      Database__MaxPoolSize: ${WORKER_DB_POOL_MAX:-3}
    # Several workers are safe: outbox rows are claimed with FOR UPDATE SKIP LOCKED.
    deploy:
      replicas: ${WORKER_REPLICAS:-1}
      resources:
        limits:
          memory: ${WORKER_MEM_LIMIT:-256m}
    # app: outbound internet for providers (Google Meet, email); data: PostgreSQL.
    networks: [app, data]
    depends_on:
      migrator:
        condition: service_completed_successfully
    logging: *logging

  # Signaling of the built-in classroom (services/signaling): WebSocket at /rtc/ws through Caddy. Rooms live in memory,
  # so it runs as ONE replica; it reports joins/leaves to the API, which turns them into attendance.
  signaling:
    image: ${IMAGE_SIGNALING:-ghcr.io/OWNER/konnyaku-signaling}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      SIGNALING_SECRET: ${SIGNALING_SECRET:?}
      API_URL: http://api:8080
      # People per room. Mesh: everyone sends video to everyone; above ~6 upload bandwidth and CPU of each device suffer.
      ROOM_CAPACITY: ${ROOM_CAPACITY:-6}
    # ~1 MiB idle, ~210 KiB per connected person (docs/toi-uu-tai-nguyen.md). Rooms live in memory: if this limit is
    # hit every room drops, so size it for the busiest hour (256m: ~1 100 people).
    deploy:
      resources:
        limits:
          memory: ${SIGNALING_MEM_LIMIT:-256m}
    networks: [edge, app]
    depends_on: [api]
    logging: *logging

  # TURN relay for participants behind strict NATs/firewalls (TURN REST API: the API hands out credentials signed
  # with TURN_SECRET, valid a few hours). Host network: a container port range would mean one proxy per port.
  coturn:
    image: coturn/coturn:4.7.0
    restart: unless-stopped
    network_mode: host
    environment:
      TURN_SECRET: ${TURN_SECRET:?}
      TURN_REALM: ${BASE_DOMAIN:?}
      TURN_MIN_PORT: ${TURN_MIN_PORT:-49160}
      TURN_MAX_PORT: ${TURN_MAX_PORT:-49260}
      # Public IP when the server only sees a private one (cloud NAT, e.g. AWS/GCP): public or public/private.
      TURN_EXTERNAL_IP: ${TURN_EXTERNAL_IP:-}
    # Relaying to private/loopback addresses is refused, so TURN cannot be used to reach internal services.
    entrypoint:
      - sh
      - -c
      - >-
        exec turnserver -n --log-file=stdout --no-cli --no-tls --no-dtls --fingerprint
        --listening-port=3478 --min-port=$$TURN_MIN_PORT --max-port=$$TURN_MAX_PORT
        --use-auth-secret --static-auth-secret=$$TURN_SECRET --realm=$$TURN_REALM
        $${TURN_EXTERNAL_IP:+--external-ip=$$TURN_EXTERNAL_IP}
        --no-multicast-peers --no-loopback-peers
        --denied-peer-ip=0.0.0.0-0.255.255.255 --denied-peer-ip=10.0.0.0-10.255.255.255
        --denied-peer-ip=100.64.0.0-100.127.255.255 --denied-peer-ip=127.0.0.0-127.255.255.255
        --denied-peer-ip=169.254.0.0-169.254.255.255 --denied-peer-ip=172.16.0.0-172.31.255.255
        --denied-peer-ip=192.168.0.0-192.168.255.255 --denied-peer-ip=::1
        --denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
        --denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
        --user-quota=12 --total-quota=1200
    deploy:
      resources:
        limits:
          memory: ${COTURN_MEM_LIMIT:-128m}
    logging: *logging

  # Runs on every `up`, applies pending EF migrations with the schema owner, then exits.
  migrator:
    image: ${IMAGE_MIGRATOR:-ghcr.io/OWNER/konnyaku-migrator}:${IMAGE_TAG:-latest}
    restart: "no"
    environment:
      ConnectionStrings__Owner: Host=postgres;Database=konnyaku;Username=konnyaku;Password=${POSTGRES_PASSWORD:?}
    networks: [data]
    depends_on:
      postgres:
        condition: service_healthy
    logging: *logging

  postgres:
    image: postgres:17
    restart: unless-stopped
    shm_size: 256mb
    # Sized per machine in .env (docs/toi-uu-tai-nguyen.md). Each connection costs a few MB, so keep the pools small.
    command:
      - postgres
      - -c
      - max_connections=${PG_MAX_CONNECTIONS:-200}
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-512MB}
      - -c
      - effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-3GB}
      - -c
      - work_mem=${PG_WORK_MEM:-8MB}
      - -c
      - maintenance_work_mem=${PG_MAINTENANCE_WORK_MEM:-128MB}
    deploy:
      resources:
        limits:
          memory: ${PG_MEM_LIMIT:-2g}
    environment:
      POSTGRES_USER: konnyaku
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: konnyaku
      DB_PASSWORD_PLATFORM: ${DB_PASSWORD_PLATFORM:?}
      DB_PASSWORD_CATALOG: ${DB_PASSWORD_CATALOG:?}
      DB_PASSWORD_IDENTITY: ${DB_PASSWORD_IDENTITY:?}
      DB_PASSWORD_ORGANIZATION: ${DB_PASSWORD_ORGANIZATION:?}
      DB_PASSWORD_ACADEMIC: ${DB_PASSWORD_ACADEMIC:?}
      DB_PASSWORD_CRM: ${DB_PASSWORD_CRM:?}
      DB_PASSWORD_SCHEDULING: ${DB_PASSWORD_SCHEDULING:?}
      DB_PASSWORD_BILLING: ${DB_PASSWORD_BILLING:?}
      DB_PASSWORD_WORKSPACE: ${DB_PASSWORD_WORKSPACE:?}
      DB_PASSWORD_LEARNING: ${DB_PASSWORD_LEARNING:?}
      DB_PASSWORD_HR: ${DB_PASSWORD_HR:?}
      DB_PASSWORD_NOTIFICATION: ${DB_PASSWORD_NOTIFICATION:?}
      DB_PASSWORD_ASSESSMENT: ${DB_PASSWORD_ASSESSMENT:?}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
      - ${BACKUP_DIR:-./backups}:/backups
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U konnyaku -d konnyaku"]
      interval: 5s
      retries: 10
    logging: *logging

networks:
  edge: {}
  app:
    ipam:
      config:
        - subnet: ${APP_SUBNET:-172.30.1.0/24}
  # No route to the internet is needed by PostgreSQL; Api/Worker reach it here.
  data:
    internal: true

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
