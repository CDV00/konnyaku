[package]
name = "konnyaku-signaling"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Realtime gateway of Konnyaku: classroom signaling (WebRTC mesh: SDP/ICE, room presence) and per-user realtime signals from Redis."
license = "UNLICENSED"
publish = false

[dependencies]
axum = { version = "0.8", features = ["ws"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
humantime = "2"
jsonwebtoken = "9"
redis = { version = "1", default-features = false, features = ["tokio-comp"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "sync", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tokio-tungstenite = "0.26"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
